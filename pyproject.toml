[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-intelligent-agent"
version = "1.0.0"
description = "Production-ready MLOps AI Agent integrating DVC, MLflow, Airflow, and Kubernetes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MLOps & Production AI Team", email = "mlops@company.org" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "mlflow>=2.12.0",
    "dvc>=3.48.0",
    "kubernetes>=29.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
