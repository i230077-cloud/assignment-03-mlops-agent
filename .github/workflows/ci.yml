name: MLOps Intelligent Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint, Test & Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint Code with Ruff (Syntax & Fatal Errors)
        run: |
          ruff check agent/ api/ dags/ training/ tests/ --select E9,F63,F7,F82

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Verify Kubernetes Manifest Syntax
        run: |
          python -c "
          import yaml
          for path in ['kubernetes/configmap.yaml', 'kubernetes/deployment.yaml', 'kubernetes/service.yaml']:
              with open(path) as f:
                  list(yaml.safe_load_all(f))
              print(f'Valid YAML: {path}')
          "

      - name: Execute End-to-End MLOps Demonstration Scenarios
        run: |
          python demo_scenarios.py --ci-mode

